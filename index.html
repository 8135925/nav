<style>
  /* 动态背景 */
  .bg-layer{position:fixed;inset:0;z-index:-1;overflow:hidden;transition:background-color .5s}
  html.dark .bg-layer{
    background-color:#0f172a;
    background-image:
      radial-gradient(at 0% 0%, rgba(17,24,39,1) 0, transparent 50%),
      radial-gradient(at 50% 0%, rgba(88,28,135,.3) 0, transparent 50%),
      radial-gradient(at 100% 0%, rgba(15,23,42,1) 0, transparent 50%);
  }
  html:not(.dark) .bg-layer{
    background-color:#f8fafc;
    background-image:
      radial-gradient(at 0% 0%, rgba(219,234,254,1) 0, transparent 50%),
      radial-gradient(at 50% 0%, rgba(243,232,255,.8) 0, transparent 50%),
      radial-gradient(at 100% 0%, rgba(241,245,249,1) 0, transparent 50%);
  }
  @keyframes drift{
    0%{transform:translate(0,0) scale(1)}
    33%{transform:translate(30px,-50px) scale(1.1)}
    66%{transform:translate(-20px,20px) scale(.9)}
    100%{transform:translate(0,0) scale(1)}
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
  }
  .blob{animation:drift 7s infinite}
  .blob.d2{animation-delay:2s}
  .blob.d4{animation-delay:4s}
  .rise{animation:rise .5s ease-out forwards}

  /* 磨砂玻璃卡片 */
  .glass{
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:all .4s cubic-bezier(.4,0,.2,1);border:1px solid;
  }
  html.dark .glass{background:rgba(30,41,59,.6);border-color:rgba(255,255,255,.05);box-shadow:0 4px 6px -1px rgba(0,0,0,.3)}
  html.dark .glass:hover{background:rgba(30,41,59,.8);border-color:rgba(6,182,212,.5);box-shadow:0 0 20px rgba(6,182,212,.2);transform:translateY(-5px)}
  html:not(.dark) .glass{background:rgba(255,255,255,.7);border-color:rgba(0,0,0,.05);box-shadow:0 4px 6px -1px rgba(148,163,184,.1)}
  html:not(.dark) .glass:hover{background:rgba(255,255,255,.95);border-color:rgba(6,182,212,.5);box-shadow:0 10px 25px -5px rgba(6,182,212,.15);transform:translateY(-5px)}

  /* 分类按钮激活态 */
  .cat-btn.on div,.cat-btn.on span,.cat-btn.on i{color:#fff !important}
  html:not(.dark) .cat-btn.on{background:#334155;border-color:#334155;color:#fff !important;box-shadow:0 4px 12px rgba(51,65,85,.3)}
  html.dark .cat-btn.on{background:#06b6d4;border-color:#06b6d4;color:#fff !important;box-shadow:0 0 15px rgba(6,182,212,.4)}

  /* 滚动条 */
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  html.dark ::-webkit-scrollbar-thumb{background:#475569}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8}
  html.dark ::-webkit-scrollbar-thumb:hover{background:#64748b}

  /* 回到顶部 */
  #topBtn{position:fixed;bottom:30px;right:30px;z-index:50;opacity:0;visibility:hidden;transition:all .3s}
  #topBtn.show{opacity:1;visibility:visible}
</style>

];

/* ================= 渲染 ================= */
const catRow  = document.getElementById('catRow');
const grid    = document.getElementById('grid');
const heroRow = document.getElementById('heroRow');
const searchIn = document.getElementById('searchIn');
let activeCat = 'all';

const catName = id => (CATS.find(c => c.id === id) || {}).name || '工具';
const iconCls = icon => (icon.includes('fa-brands') || icon.includes('fa-solid')) ? icon : 'fa-solid ' + icon;

function drawHero(){
  heroRow.innerHTML = HERO.map(m => `
    <a href="${m.url}" target="_blank" class="group flex flex-col items-center gap-2 cursor-pointer transition-transform hover:-translate-y-1">
      <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl ${m.bg} shadow-lg shadow-gray-400/20 flex items-center justify-center text-white text-3xl relative overflow-hidden group-hover:ring-4 ring-opacity-20 ring-gray-300 transition-all">
        <i class="${iconCls(m.icon)} relative z-10"></i>
        <div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-20 transition-opacity"></div>
      </div>
      <span class="text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 group-hover:text-cyan-600 dark:group-hover:text-cyan-400 transition-colors">${m.name}</span>
    </a>`).join('');
}

function drawCats(){
  catRow.innerHTML = CATS.map(c => `
    <button data-cat="${c.id}"
      class="cat-btn glass px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-slate-200 dark:hover:bg-slate-700 transition cursor-pointer border-transparent ${c.id === activeCat ? 'on' : 'text-slate-600 dark:text-slate-300'}">
      <div class="${c.color}"><i class="fa-solid ${c.icon}"></i></div>
      <span class="text-sm font-bold whitespace-nowrap">${c.name}</span>
    </button>`).join('');
}

function drawGrid(list){
  grid.innerHTML = '';
  if(!list.length){
    grid.innerHTML = `
      <div class="col-span-full text-center py-20">
        <div class="inline-block p-6 rounded-full bg-slate-100 dark:bg-slate-800 mb-4">
          <i class="fa-solid fa-ghost text-4xl text-slate-300 dark:text-slate-600"></i>
        </div>
        <p class="text-slate-500 dark:text-slate-400">没有找到相关工具，换个词试试？</p>
      </div>`;
    return;
  }
  list.forEach((t, i) => {
    const card = document.createElement('div');
    card.className = 'glass rounded-2xl p-6 flex flex-col h-full group rise relative overflow-hidden';
    card.style.animationDelay = `${Math.min(i*50, 1000)}ms`;
    card.innerHTML = `
      <div class="absolute top-0 right-0 p-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
        <i class="fa-solid fa-arrow-up-right-from-square text-cyan-500"></i>
      </div>
      <div class="flex items-start gap-4 mb-4">
        <div class="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center border border-slate-200 dark:border-slate-700 flex-shrink-0 group-hover:scale-110 transition-transform duration-300 shadow-sm">
          <i class="${iconCls(t.icon)} ${t.color} text-2xl"></i>
        </div>
        <div>
          <h3 class="font-bold text-slate-800 dark:text-white text-lg group-hover:text-cyan-600 dark:group-hover:text-cyan-400 transition">${t.name}</h3>
          <span class="text-xs font-medium bg-slate-100 dark:bg-slate-700/50 text-slate-500 dark:text-slate-400 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700 mt-1 inline-block">${catName(t.cat)}</span>
        </div>
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400 line-clamp-2 mb-4 flex-grow leading-relaxed group-hover:text-slate-600 dark:group-hover:text-slate-300 transition-colors">${t.desc}</p>
      <a href="${t.url}" target="_blank" class="absolute inset-0 z-10" aria-label="访问 ${t.name}"></a>`;
    grid.appendChild(card);
  });
}

/* ================= 交互 ================= */
catRow.addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if(!btn) return;
  activeCat = btn.dataset.cat;
  drawCats();
  drawGrid(activeCat === 'all' ? TOOLS : TOOLS.filter(t => t.cat === activeCat));
});

searchIn.addEventListener('input', e => {
  const kw = e.target.value.toLowerCase().trim();
  if(kw){ activeCat = null; } else { activeCat = 'all'; }
  drawCats();
  drawGrid(TOOLS.filter(t =>
    t.name.toLowerCase().includes(kw) || t.desc.toLowerCase().includes(kw)));
});

window.addEventListener('scroll', () => {
  document.getElementById('topBtn').classList.toggle('show', scrollY > 300);
});
document.getElementById('topBtn').addEventListener('click', () => scrollTo({top:0, behavior:'smooth'}));

/* ================= 启动 ================= */
drawHero();
drawCats();
drawGrid(TOOLS);
</script>
</body>
</html>
